<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK authorization · Tech Brand Watch</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:720px;margin:64px auto;padding:0 20px;line-height:1.55;background:#f4f6f5;color:#15221e}
.card{background:#fff;border:1px solid #d8e0dd;border-radius:14px;padding:24px}
button{font:inherit;border:0;border-radius:999px;padding:11px 18px;background:#1677ff;color:#fff;cursor:pointer}
small{color:#667570}.err{color:#a22}
</style>
</head>
<body>
<div class="card">
<h1>Подключить VK Video</h1>
<p>Авторизация нужна только для чтения публичных video-метрик через VK API.</p>
<button id="login">Продолжить через VK ID</button>
<p id="status"><small>Используется OAuth 2.1 + PKCE. Токен здесь не сохраняется.</small></p>
</div>
<script>
const APP_ID=54811614;
const REDIRECT="https://olesiabositi-hub.github.io/research/tech-brand-watch/vk-callback.html";
const SDK_VERSION="2.6.1";

function randomString(len=72){
  const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const bytes=new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>alphabet[b%alphabet.length]).join("");
}
function base64url(bytes){
  let s="";
  bytes.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_");
}
async function challenge(verifier){
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));
  return base64url(new Uint8Array(digest));
}

document.getElementById("login").onclick=async()=>{
  const status=document.getElementById("status");
  try{
    const verifier=randomString();
    const state=randomString(32);
    const codeChallenge=await challenge(verifier);

    sessionStorage.setItem("vk_code_verifier",verifier);
    sessionStorage.setItem("vk_state",state);

    const p=new URLSearchParams({
      response_type:"code",
      code_challenge:codeChallenge,
      code_challenge_method:"s256",
      client_id:String(APP_ID),
      scope:"video",
      state,
      prompt:"",
      v:SDK_VERSION,
      sdk_type:"vkid",
      app_id:String(APP_ID),
      redirect_uri:REDIRECT
    });
    location.assign("https://id.vk.ru/authorize?"+p.toString());
  }catch(e){
    status.innerHTML='<span class="err">'+String(e.message||e)+'</span>';
  }
};
</script>
</body>
</html>
