const DATA={
1:{range:"1938—1959",title:"Когда будущее рисовали на бумаге",intro:"Как инженеры, картографы и радиотехники искали способы помочь человеку ориентироваться в городе — и заложили идеи, которыми мы пользуемся сегодня.",question:"Как превратить сигнал в ориентир — и научить технику понимать, где находится человек?",qnote:"В первой эпохе карта ещё не стала базой данных. Но инженерная мысль уже соединяет радиосигнал, изображение местности, автоматическое движение и навигацию в одну задачу.",memo:"Как помочь человеку найти свой путь в городе?",hero:["https://www.designspb.ru/upload/medialibrary/a43/dolmatovskiy_1.jpg","https://fantlab.ru/images/editions/big/222485?r=1529499949","https://djvu.online/jpg1/v/c/z/vczZJckoOQdkp/034.webp","https://fantlab.ru/images/editions/big/384832?r=1682442393"],events:[

["https://djvu.online/jpg1/v/c/z/vczZJckoOQdkp/034.webp","https://djvu.online/file/vczZJckoOQdkp"]],sourceTitle:"Журнал и его идеи",sourceText:"Реальные выпуски «Техники — молодёжи» показывают, как вопросы будущего формулировались языком своего времени — без реконструкций вместо источников.",ideaTitle:"Как идея ожила",ideaText:"От радиоволн и бумажных схем — к цифровому позиционированию. Меняются инструменты, но задача остаётся: понять, где находится человек и как показать ему путь.",modernTitle:"Те же вопросы. Новые технологии.",modernIntro:"Сегодня задача осталась той же: помочь человеку точно понять, где он находится и куда двигаться дальше. Только вместо радиосигналов и бумажных схем — спутниковые данные, датчики, алгоритмы позиционирования и навигация в реальном времени.",modern:[

2:{range:"1960—1983",title:"Город становится вычислимым",intro:"Вычислительная машина получает город как задачу: сеть улиц, расстояния, маршруты и положение в пространстве можно описать формально и посчитать.",question:"Как научить машину не только находить путь, но и понимать, где она находится и что происходит вокруг?",qnote:"Здесь появляется важный переход от образа навигации к вычислимой модели: точки, расстояния, оптимальный путь и определение положения складываются в одну систему.",memo:"Город можно описать так, чтобы машина его поняла.",hero:["https://djvu.online/jpg1/z/K/w/zKwC09TdR1376/090.webp","https://www.nkj.ru/upload/iblock/5a1/h5shrr1n0us811is84c2g4obtnkowx5a.jpg","https://djvu.online/jpg1/z/K/w/zKwC09TdR1376/093.webp","https://djvu.online/jpg1/z/K/w/zKwC09TdR1376/090.webp"],events:[

["1975","Загадки пернатого штурмана","Г. Николаев разбирает природные механизмы ориентации птиц — соседний вопрос о направлении и положении.","https://www.nkj.ru/upload/iblock/5a1/h5shrr1n0us811is84c2g4obtnkowx5a.jpg"],
["1980","Робот-штурман","В. Тарасенко и А. Кориков объединяют планирование пути, определение положения и движение по маршруту.","https://djvu.online/jpg1/z/K/w/zKwC09TdR1376/090.webp"]],sources:[
["https://www.nkj.ru/upload/iblock/5a1/h5shrr1n0us811is84c2g4obtnkowx5a.jpg","https://djvu.online/file/lz0mfLRWpWh5L"],
["https://djvu.online/jpg1/z/K/w/zKwC09TdR1376/090.webp","https://djvu.online/file/zKwC09TdR1376"],

["2026 · routing","Как в 2ГИС появились «лёгкие маршруты»","Маршрут может оптимизироваться не только по времени, но и по количеству стрессовых манёвров.","https://habrastorage.org/r/w1560/getpro/habr/upload_files/9e8/802/e90/9e8802e90906e23a105bb0183c779412.png","https://habr.com/ru/companies/2gis/articles/1015140/"],

3:{range:"1984—2026",title:"Когда карта стала больше, чем карта",intro:"Карта перестаёт быть только изображением города. Она становится источником данных, соединяет объекты и смыслы — и помогает отвечать на всё больше вопросов о мире вокруг нас.",question:"Что происходит, когда карта начинает не только показывать город, но и отвечать на вопросы о нём?",qnote:"Карта превращается в информационную систему: описывает город, объединяет разные данные, помогает искать закономерности и принимать решения — от простых бытовых до сложных городских и бизнес-задач.",memo:"Карта помогает не только идти, но и понять, как устроен город.",hero:["https://djvu.online/jpg1/c/0/h/c0htS5DZQyLQb/084.webp","https://djvu.online/jpg1/c/0/h/c0htS5DZQyLQb/086.webp","https://habrastorage.org/r/w1560/getpro/habr/upload_files/953/c02/9ee/953c029eefe0b10e0f94ba8edc17ab2c.png","https://habrastorage.org/r/w1560/getpro/habr/upload_files/006/2d6/ce2/0062d6ce2eaf4c57d0d7bba0e9c82f77.png"],events:[
