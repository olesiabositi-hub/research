          python3 - <<'PY'
          import re, pathlib, os
          root = pathlib.Path("2gis-tech-museum")
          urls = set()
          for p in root.glob("*"):
              if p.suffix.lower() in {".html",".js",".css",".md"}:
                  try:
                      s = p.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  urls.update(re.findall(r"https?://[^\s\"'<>]+", s))
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "2gis-developer-handoff" / "ALL_LINKS.txt"
          out.write_text("\n".join(sorted(u.rstrip("),;]") for u in urls)) + "\n", encoding="utf-8")
          PY

