name: Export 2GIS developer handoff

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/export-2gis-handoff.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build handoff package
        shell: bash
        run: |
          set -u
          ROOT="$RUNNER_TEMP/2gis-developer-handoff"
          IMG="$ROOT/images"
          mkdir -p "$IMG/01-home" "$IMG/02-era-1" "$IMG/03-era-2" "$IMG/04-era-3" "$IMG/05-people-and-covers" "$IMG/06-local-assets" "$ROOT/site-source"

          cp 2gis-tech-museum/index.html "$ROOT/site-source/"
          cp 2gis-tech-museum/era.html "$ROOT/site-source/"
          cp 2gis-tech-museum/archive.html "$ROOT/site-source/"
          cp 2gis-tech-museum/about.html "$ROOT/site-source/"
          cp 2gis-tech-museum/stories-data.js "$ROOT/site-source/" || true
          cp 2gis-tech-museum/stories.js "$ROOT/site-source/" || true
          cp 2gis-tech-museum/story.js "$ROOT/site-source/" || true
          cp 2gis-tech-museum/style.css "$ROOT/site-source/" || true
          cp 2gis-tech-museum/site.js "$ROOT/site-source/" || true

          find 2gis-tech-museum/assets -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.svg' \) -exec cp {} "$IMG/06-local-assets/" \;

          cat > "$ROOT/FONTS.md" <<'EOF'
          # Corporate fonts

          Site font family: **SB Sans Text**

          Used weights:
          - Regular — 400
          - Medium — 500
          - SemiBold — 600 (also used as the heavier fallback where needed)

          Current web-font paths in the repository:
          - `2gis-tech-museum/assets/fonts/SBSansText-Regular.woff2`
          - `2gis-tech-museum/assets/fonts/SBSansText-Medium.woff2`
          - `2gis-tech-museum/assets/fonts/SBSansText-SemiBold.woff2`

          Original supplied font files:
          - `SBSansText-Regular.ttf`
          - `SBSansText-Medium.ttf`
          - `SBSansText-SemiBold.ttf`

          CSS:
          ```css
          @font-face {
            font-family: "SB Sans Text";
            src: url("assets/fonts/SBSansText-Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
          }
          @font-face {
            font-family: "SB Sans Text";
            src: url("assets/fonts/SBSansText-Medium.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
          }
          @font-face {
            font-family: "SB Sans Text";
            src: url("assets/fonts/SBSansText-SemiBold.woff2") format("woff2");
            font-weight: 600 900;
            font-style: normal;
            font-display: swap;
          }
          ```

          The font binaries are already present in the project repository at the paths above.
          EOF

          cat > "$ROOT/README.md" <<'EOF'
          # 2GIS — «Как машина научилась понимать город»
          ## Developer handoff

          This package contains:
          - `images/` — downloaded and local visual assets with semantic filenames;
          - `IMAGE_MANIFEST.csv` — image → block → source mapping;
          - `ALL_LINKS.txt` — deduplicated URLs found in the current site source;
          - `SOURCES.md` — key historical and contemporary sources grouped by era;
          - `site-source/` — current HTML/JS/CSS snapshot;
          - `FONTS.md` — corporate font setup and repository paths;
          - `MISSING_DOWNLOADS.txt` — URLs that refused automated download, if any.

          Important:
          - Historical scans and Habr images are source materials; rights should be checked before public reproduction.
          - Chapter 4 (2027—2056) intentionally has no invented future visual content.
          - Do not substitute real archive materials with generated imitations.
          EOF

          : > "$ROOT/MISSING_DOWNLOADS.txt"

          download () {
            out="$1"; url="$2"; referer="${3:-}"
            mkdir -p "$(dirname "$out")"
            args=(-L --fail --silent --show-error --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 60 -A "Mozilla/5.0")
            if [ -n "$referer" ]; then args+=(-e "$referer"); fi
            if ! curl "${args[@]}" "$url" -o "$out"; then
              echo "$url" >> "$ROOT/MISSING_DOWNLOADS.txt"
              rm -f "$out"
            fi
          }

          download "$IMG/01-home/01-hero-map-information-1984-page086.webp" "https://djvu.online/jpg1/c/0/h/c0htS5DZQyLQb/086.webp" "https://djvu.online/file/c0htS5DZQyLQb"
          download "$IMG/01-home/02-hero-dolmatovsky-zis1001.jpg" "https://www.designspb.ru/upload/medialibrary/a43/dolmatovskiy_1.jpg" "https://www.designspb.ru/"
          download "$IMG/01-home/03-cover-tech-youth-1954.jpg" "https://fantlab.ru/images/editions/big/384832?r=1682442393" "https://fantlab.ru/"
          download "$IMG/01-home/04-engineer-dreams-1956-page034.webp" "https://djvu.online/jpg1/v/c/z/vczZJckoOQdkp/034.webp" "https://djvu.online/file/vczZJckoOQdkp"
          download "$IMG/01-home/05-future-city-real-cutout-01.jpg" "https://image6.thematicnews.com/uploads/images/00/00/41/2018/06/27/83ec6ba776.jpg" "https://back-in-ussr.com/2018/06/zhurnal-tehnikamolodezhi-ob-arhitekture-buduschego.html"
          download "$IMG/01-home/06-future-city-real-cutout-02.jpg" "https://image7.thematicnews.com/uploads/images/00/00/41/2018/06/27/0e8a3b031a.jpg" "https://back-in-ussr.com/2018/06/zhurnal-tehnikamolodezhi-ob-arhitekture-buduschego.html"

