          download "$IMG/05-people-and-covers/02-georgiy-babat-portrait.jpg" "https://archivsf.narod.ru/1911/georgiy_babat/georgiy_babat_.jpg" "https://archivsf.narod.ru/"
          download "$IMG/05-people-and-covers/03-vladimir-tarasenko-portrait.jpg" "https://upload.wikimedia.org/wikipedia/ru/thumb/d/db/Tarasenko_VP.jpg/248px-Tarasenko_VP.jpg" "https://ru.wikipedia.org/"
          download "$IMG/05-people-and-covers/04-science-life-1980-cover.webp" "https://djvu.online/jpg1/z/K/w/zKwC09TdR1376/001.webp" "https://djvu.online/file/zKwC09TdR1376"
          download "$IMG/05-people-and-covers/05-science-life-1984-cover.webp" "https://djvu.online/jpg1/c/0/h/c0htS5DZQyLQb/001.webp" "https://djvu.online/file/c0htS5DZQyLQb"

          cat > "$ROOT/IMAGE_MANIFEST.csv" <<'EOF'
