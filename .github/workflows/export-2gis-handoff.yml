          01-home/05-future-city-real-cutout-01.jpg,Homepage future-on-paper block,https://image6.thematicnews.com/uploads/images/00/00/41/2018/06/27/83ec6ba776.jpg,https://back-in-ussr.com/2018/06/zhurnal-tehnikamolodezhi-ob-arhitekture-buduschego.html
          01-home/06-future-city-real-cutout-02.jpg,Homepage future-on-paper block,https://image7.thematicnews.com/uploads/images/00/00/41/2018/06/27/0e8a3b031a.jpg,https://back-in-ussr.com/2018/06/zhurnal-tehnikamolodezhi-ob-arhitekture-buduschego.html
          02-era-1/01-dolmatovsky-zis1001.jpg,Era 1 / 1938,https://www.designspb.ru/upload/medialibrary/a43/dolmatovskiy_1.jpg,https://ru.djvu.online/file/jCxy9WnwPsCP5
          02-era-1/02-tech-youth-1938-cover.jpg,Era 1 / 1938 cover,https://fantlab.ru/images/editions/big/222485?r=1529499949,https://ru.djvu.online/file/jCxy9WnwPsCP5
