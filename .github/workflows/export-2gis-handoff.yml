          [ -s "$ROOT/MISSING_DOWNLOADS.txt" ] || rm "$ROOT/MISSING_DOWNLOADS.txt"

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2gis-developer-handoff
          path: ${{ runner.temp }}/2gis-developer-handoff
          if-no-files-found: error
          retention-days: 2
