name: Update RUTUBE Q3 data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tech-brand-watch/config/rutube-sources.json"
      - "tech-brand-watch/scripts/update-rutube.mjs"
      - ".github/workflows/update-rutube-q3.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect RUTUBE Q3 metrics
        run: node tech-brand-watch/scripts/update-rutube.mjs

      - name: Commit refreshed RUTUBE data
        run: |
          if [ -z "$(git status --porcelain -- tech-brand-watch/data/rutube.json)" ]; then
            echo "No RUTUBE data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-brand-watch/data/rutube.json
          git commit -m "Update RUTUBE Q3 metrics"
          git pull --rebase origin main
          git push
