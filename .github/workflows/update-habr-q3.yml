name: Update Habr Q3 data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tech-brand-watch/config/habr-companies.json"
      - "tech-brand-watch/scripts/update-habr.mjs"
      - ".github/workflows/update-habr-q3.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect Habr Q3 metrics
        run: node tech-brand-watch/scripts/update-habr.mjs

      - name: Commit refreshed Habr data
        run: |
          if [ -z "$(git status --porcelain -- tech-brand-watch/data/habr.json)" ]; then
            echo "No Habr data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-brand-watch/data/habr.json
          git commit -m "Update Habr Q3 metrics"
          git push
